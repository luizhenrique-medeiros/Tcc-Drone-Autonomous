[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "drone-delivery-gateway"
version = "0.1.0"
description = "Gateway MAVLink seguro para o protótipo acadêmico DEVcore"
requires-python = ">=3.13,<3.14"
dependencies = [
  "httpx>=0.28,<0.29",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.15,<3",
  "pymavlink>=2.4.49,<3",
  "pyserial>=3.5,<4",
]

[project.scripts]
drone-gateway-list-ports = "app.tools.list_ports:main"
drone-gateway-diagnose = "app.tools.mavlink_diagnose:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.16.3,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"
